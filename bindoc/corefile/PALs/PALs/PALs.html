<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PALs: STI College Cubao SHS | Homepage</title>
    
    <link rel="stylesheet" href="CSS/Pals.css" />
</head>

<body>
    <!--container for theme-->
    <div class="palRoot" id="palRoot">

    <!--header bar-->
<header>
    <div class="sidebar-toggle-container">
        <button id="sidebarToggle" aria-label="Toggle Navigation">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-panels-top-left-icon lucide-panels-top-left"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 21V3"/></svg>
        </button>
    </div>

    <a class="brand" href="PALs.html" aria-label="PALs homepage">
        <img src="z/PALs.png" height="40px" alt="PALs"/>
    </a>
    
    <button class="user-row header-user" type="button" data-navigate="pages/user.html" aria-label="View and edit profile">
        <div class="avatar">JM</div>
        <div class="user-details">
            <div class="user-name">J. Mike</div>
            <div class="user-role">Grade 12 - ITM302</div>
        </div>
    </button>
</header>

<!-- shell containing sidebar and main content-->
<div class="shell">
    <!-- sidebar navigation -->
    <aside class="sidebar">
        
        <nav class="sidebar-nav">
            <div class="nav-section">Main</div>

                <span class="nav-text">Home</span>
            </div>
            <div class="nav-item" data-page="pages/tutors.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users-icon lucide-users"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg>
                <span class="nav-text">Tutors</span>

            <div class="nav-item" data-page="pages/tutees.html">

                <span class="nav-text">Tutees</span>
            </div>
            <div class="nav-item" data-page="pages/sessions.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-icon lucide-calendar"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                <span class="nav-text">Sessions</span>
            </div>
            <div class="nav-item" data-page="pages/resources.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-library-icon lucide-square-library"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7v10"/><path d="M11 7v10"/><path d="m15 7 2 10"/></svg>
                <span class="nav-text">Resources</span>
            </div>
            <div class="nav-item" data-page="pages/analytics.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chart-no-axes-combined-icon lucide-chart-no-axes-combined"><path d="M12 16v5"/><path d="M16 14.639V21"/><path d="M20 10.656V21"/><path d="m22 3-8.646 8.646a.5.5 0 0 1-.708 0L9.354 8.354a.5.5 0 0 0-.707 0L2 15"/><path d="M4 18.463V21"/><path d="M8 14.656V21"/></svg>
                <span class="nav-text">Analytics</span>
            </div>
            <div class="nav-border"></div>
            <div class="nav-section">System</div>
            <div class="nav-item" data-page="pages/settings.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>

                <span class="nav-text">Help</span>
            </div>
            <div class="nav-item" data-page="pages/feedback.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-messages-square-icon lucide-messages-square"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></svg>
                <span class="nav-text">Feedback</span>
            </div>
        </nav>

        <!-- User profile -->
        <div class="sidebar-user">
            <div class="switch">
                <svg id="themeIcon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--text-secondary)" stroke-width="1.5">
                    <defs>
                        <mask id="moon-cutout">
                            <rect x="0" y="0" width="16" height="16" fill="white" />
                            <circle id="mask-circle" cx="16" cy="0" r="4" fill="black" />
                        </mask>
                    </defs>
                    <circle id="theme-circle" cx="8" cy="8" r="5" fill="none" mask="url(#moon-cutout)" />
                </svg>

                <span class="toggle-label" id="modeLabel">Light</span>
                <label class="tog" aria-label="Toggle dark mode">
                    <input type="checkbox" id="darkToggle">
                    <div class="tog-track"></div>
                    <div class="tog-thumb"></div>
                </label>
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="var(--text-secondary)" stroke-width="1.5" aria-hidden="true">
                    <path d="M13 9.5A6 6 0 017 3.5a6.5 6.5 0 100 9 6 6 0 006-3z" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
    </aside>


    <!-- Main content area -->
    <main>
        <!-- Content area linked to pages folder -->
        <div class="content"></div>
    </main>
</div>
<!-- JavaScript for dark mode toggle -->
<script src="JS/pals.js" defer></script>
</body>
</html>
