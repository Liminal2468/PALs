<div class="telemetry-table-wrap">
    <table class="telemetry-table telemetry-graph-table">
        <caption class="sr-only">API request telemetry graph table</caption>
        <thead><tr><th scope="col">Metric</th><th scope="col">Current</th><th scope="col">Graph</th><th scope="col">Source</th></tr></thead>
        <tbody>
            <tr><th scope="row">GET reads / ms</th><td data-telemetry-graph-value="reads">—</td><td><div class="telemetry-bar"><span data-telemetry-bar="reads"></span></div></td><td>database.reads()</td></tr>
            <tr><th scope="row">POST/PUT/PATCH writes / ms</th><td data-telemetry-graph-value="writes">—</td><td><div class="telemetry-bar"><span data-telemetry-bar="writes"></span></div></td><td>database.writes()</td></tr>
            <tr><th scope="row">Incoming API calls</th><td data-telemetry-graph-value="incoming">—</td><td><div class="telemetry-bar"><span data-telemetry-bar="incoming"></span></div></td><td>requests.incoming()</td></tr>
            <tr><th scope="row">Outgoing API calls</th><td data-telemetry-graph-value="outgoing">—</td><td><div class="telemetry-bar"><span data-telemetry-bar="outgoing"></span></div></td><td>requests.outgoing()</td></tr>
        </tbody>
    </table>
</div>
