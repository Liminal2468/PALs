<dialog class="login-dialog" id="verifyDialog" aria-labelledby="verifyDialogTitle" aria-describedby="verifyDialogDescription">
    <div class="dialog-header">
        <div><h2 id="verifyDialogTitle">Verify your account</h2><p id="verifyDialogDescription">Enter the six-digit code sent to your school email.</p></div>
        <button class="dialog-close" id="closeVerifyDialog" type="button" aria-label="Close verification">&times;</button>
    </div>
    <form class="login-form" id="verifyForm" novalidate>
        <label for="verifyCode">Verification code</label>
        <input class="school-email" id="verifyCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="123456" required>
        <p class="email-error" id="verifyCodeError" aria-live="polite"></p>
        <button class="login-submit" type="submit">Verify</button><p class="login-status" id="verifyStatus" role="status" aria-live="polite"></p>
    </form>
</dialog>
