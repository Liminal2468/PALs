<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f7fa">
    <title>Log in · PALs</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Aptos", "Segoe UI", sans-serif;
        color: #20242a;
        background: #f2f7fa;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(ellipse at 12% 8%, rgb(174 220 239 / 48%), transparent 34rem),
          linear-gradient(145deg, #f7fbfd 0%, #eaf3f8 100%);
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .login-dialog {
        width: min(100%, 28rem);
        padding: clamp(1.35rem, 5vw, 2rem);
        border: 1px solid #dfe7ed;
        border-radius: 1.25rem;
        background: #fff;
        box-shadow: 0 24px 70px rgb(23 57 77 / 15%), 0 3px 10px rgb(23 57 77 / 5%);
        animation: arrive 380ms cubic-bezier(.2, .8, .2, 1) both;
      }

      .dialog-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(1.85rem, 6vw, 2.2rem);
        line-height: 1.1;
        letter-spacing: -.045em;
      }

      .intro {
        margin-top: .55rem;
        margin-bottom: 1.6rem;
        color: #66717e;
        font-size: .88rem;
        line-height: 1.55;
      }

      .close-button {
        display: grid;
        width: 2.25rem;
        height: 2.25rem;
        flex: 0 0 auto;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #56616d;
        transition: background-color 160ms ease, color 160ms ease;
      }

      .close-button:hover {
        background: #eff5f8;
        color: #20242a;
      }

      .provider-list {
        display: grid;
        gap: .7rem;
      }

      .provider-button,
      .admin-button,
      .submit-button,
      .reopen-button {
        display: flex;
        width: 100%;
        min-height: 3.15rem;
        align-items: center;
        justify-content: center;
        gap: .8rem;
        border: 1px solid #d8e1e8;
        border-radius: .75rem;
        background: #fff;
        color: #20242a;
        font-size: .9rem;
        font-weight: 650;
        transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
      }

      .provider-button:hover,
      .admin-button:hover {
        transform: translateY(-1px);
        border-color: #9dc9dc;
        background: #f8fcfe;
      }

      .provider-button:active,
      .admin-button:active {
        transform: translateY(0);
      }

      .provider-button:disabled {
        cursor: not-allowed;
        color: #64737d;
        background: #f5f7f8;
        opacity: .8;
      }

      .provider-status {
        margin-left: auto;
        color: #667780;
        font-size: .68rem;
        font-weight: 700;
        letter-spacing: .04em;
        text-transform: uppercase;
      }

      .provider-mark {
        display: grid;
        width: 1.8rem;
        height: 1.8rem;
        flex: 0 0 auto;
        place-items: center;
        border-radius: .55rem;
        background: #e8f4f9;
        color: #087cae;
        font-size: .78rem;
        font-weight: 750;
        text-transform: uppercase;
      }

      .provider-button[data-provider="google"] .provider-mark {
        background: #f3f5f7;
        color: #607181;
      }

      .provider-empty,
      .status-message {
        padding: .9rem 1rem;
        border: 1px dashed #cbd9e2;
        border-radius: .75rem;
        color: #61717d;
        font-size: .86rem;
        line-height: 1.5;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: .8rem;
        margin: 1.25rem 0;
        color: #85919b;
        font-size: .68rem;
        font-weight: 700;
        letter-spacing: .16em;
      }

      .divider::before,
      .divider::after {
        height: 1px;
        flex: 1;
        background: #e5ebef;
        content: "";
      }

      .admin-button,
      .submit-button {
        border-color: #087cae;
        background: #087cae;
        color: #fff;
      }

      .admin-button:hover,
      .submit-button:hover {
        border-color: #06658f;
        background: #066f9d;
      }

      .admin-form {
        display: grid;
        gap: .85rem;
      }

      .admin-form label {
        display: grid;
        gap: .4rem;
        color: #4b5a65;
        font-size: .82rem;
        font-weight: 650;
      }

      .admin-form input {
        width: 100%;
        min-height: 2.9rem;
        padding: .7rem .8rem;
        border: 1px solid #d4dfe6;
        border-radius: .65rem;
        background: #fbfdfe;
        color: #20242a;
      }

      .admin-form input:focus-visible {
        outline: 3px solid rgb(8 124 174 / 22%);
        border-color: #087cae;
      }

      .submit-button:disabled {
        cursor: wait;
        opacity: .7;
      }

      .back-button {
        justify-self: center;
        padding: .4rem .6rem;
        border: 0;
        background: transparent;
        color: #087cae;
        font-size: .84rem;
        font-weight: 650;
      }

      .back-button:hover {
        text-decoration: underline;
      }

      .status-message {
        margin-top: .9rem;
        border-style: solid;
        border-color: #f0c5be;
        background: #fff8f6;
        color: #8b3328;
      }

      .status-message[hidden] {
        display: none;
      }

      .reopen-button {
        width: 3.5rem;
        height: 3.5rem;
        border: 0;
        border-radius: 50%;
        background: #087cae;
        color: #fff;
        box-shadow: 0 12px 32px rgb(8 79 110 / 28%);
      }

      .reopen-button:hover {
        transform: translateY(-2px);
      }

      [hidden] {
        display: none !important;
      }

      button:focus-visible {
        outline: 3px solid #075e91;
        outline-offset: 3px;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(12px) scale(.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section
        id="login-dialog"
        class="login-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="login-heading"
        aria-describedby="login-intro"
      >
        <header class="dialog-heading">
          <h1 id="login-heading">Log in</h1>
          <button id="close-button" class="close-button" type="button" aria-label="Close login">
            <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </header>

        <p id="login-intro" class="intro">Choose how you'd like to continue to PALs.</p>

        <section id="provider-view" aria-label="Sign in with a provider">
          <div id="provider-list" class="provider-list" aria-live="polite">
            <p class="provider-empty">Loading available sign-in options…</p>
          </div>
          <p id="provider-error" class="status-message" role="status" hidden>
            Sign-in options are temporarily unavailable. Please try again.
          </p>
          <div class="divider" aria-hidden="true">OR</div>
          <button id="admin-login-button" class="admin-button" type="button">
            Admin log in
          </button>
        </section>

        <form id="admin-form" class="admin-form" hidden>
          <label>
            Username
            <input name="username" autocomplete="username" minlength="3" maxlength="64" required>
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required>
          </label>
          <label id="admin-mfa-label" hidden>
            Authenticator code
            <input name="mfaCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,8}" minlength="6" maxlength="8" placeholder="123456" hidden>
          </label>
          <p id="admin-mfa-hint" class="status-message" hidden>Enter the current code from Google Authenticator or another TOTP app.</p>
          <p id="admin-error" class="status-message" role="alert" hidden></p>
          <button id="admin-submit" class="submit-button" type="submit">Continue</button>
          <button id="admin-back" class="back-button" type="button">Back to sign-in options</button>
        </form>
      </section>

      <button id="reopen-button" class="reopen-button" type="button" aria-label="Open login" hidden>
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M10 17l5-5-5-5"></path>
          <path d="M15 12H3"></path>
          <path d="M21 3v18"></path>
        </svg>
      </button>
    </main>

    <script type="module">
      const optionsUrl = "/api/v1/auth/options";
      const providerList = document.querySelector("#provider-list");
      const providerError = document.querySelector("#provider-error");
      const providerView = document.querySelector("#provider-view");
      const dialog = document.querySelector("#login-dialog");
      const adminForm = document.querySelector("#admin-form");
      const adminError = document.querySelector("#admin-error");
      const adminSubmit = document.querySelector("#admin-submit");
      const adminMfaLabel = document.querySelector("#admin-mfa-label");
      const adminMfaInput = adminForm.elements.mfaCode;
      const adminMfaHint = document.querySelector("#admin-mfa-hint");
      let adminMfaRequired = false;
      const closeButton = document.querySelector("#close-button");
      const reopenButton = document.querySelector("#reopen-button");

      function showStatus(element, message) {
        element.textContent = message;
        element.hidden = false;
      }

      function setAdminMfaRequired(required) {
        adminMfaRequired = required;
        adminMfaLabel.hidden = !required;
        adminMfaInput.hidden = !required;
        adminMfaInput.required = required;
        adminMfaHint.hidden = !required;
        if (required) adminMfaInput.focus();
      }

      function renderProviders(providers, plannedProviders) {
        providerList.replaceChildren();

        for (const provider of providers) {
          if (
            !provider
            || typeof provider.id !== "string"
            || typeof provider.label !== "string"
            || (provider.available === true
              && (
                typeof provider.start_url !== "string"
                || !provider.start_url.startsWith("/api/v1/auth/")
              ))
          ) {
            continue;
          }
          const button = document.createElement("button");
          button.className = "provider-button";
          button.type = "button";
          button.dataset.provider = provider.id;
          button.setAttribute("aria-label", `Continue with ${provider.label}`);
          const mark = document.createElement("span");
          mark.className = "provider-mark";
          mark.setAttribute("aria-hidden", "true");
          mark.textContent = provider.id.slice(0, 1);
          const label = document.createElement("span");
          label.textContent = provider.label;
          button.disabled = provider.available !== true;
          const status = document.createElement("span");
          status.className = "provider-status";
          status.textContent = provider.status === "preview"
            ? "Preview"
            : provider.available === true
              ? "Available"
              : "Setup required";
          button.append(mark, label, status);
          if (provider.available === true) {
            button.addEventListener("click", () => {
              window.location.assign(provider.start_url);
            });
          }
          providerList.append(button);
        }

        for (const provider of plannedProviders) {
          if (
            !provider
            || typeof provider.id !== "string"
            || typeof provider.label !== "string"
            || provider.status !== "planned"
          ) {
            continue;
          }
          const button = document.createElement("button");
          button.className = "provider-button";
          button.type = "button";
          button.disabled = true;
          button.dataset.provider = provider.id;
          const mark = document.createElement("span");
          mark.className = "provider-mark";
          mark.setAttribute("aria-hidden", "true");
          mark.textContent = provider.id.slice(0, 1);
          const label = document.createElement("span");
          label.textContent = provider.label;
          const status = document.createElement("span");
          status.className = "provider-status";
          status.textContent = "Planned";
          button.append(mark, label, status);
          providerList.append(button);
        }

        if (!providerList.childElementCount) {
          const empty = document.createElement("p");
          empty.className = "provider-empty";
          empty.textContent = "No provider sign-in options are enabled right now.";
          providerList.append(empty);
        }
      }

      async function loadOptions() {
        try {
          const response = await fetch(optionsUrl, {
            headers: { Accept: "application/json" },
            credentials: "same-origin",
          });
          if (!response.ok) throw new Error("Auth options request failed.");
          const result = await response.json();
          const providers = result?.data?.providers;
          const plannedProviders = result?.data?.planned_providers;
          if (!Array.isArray(providers) || !Array.isArray(plannedProviders)) {
            throw new Error("Auth options response was invalid.");
          }
          renderProviders(providers, plannedProviders);
        } catch {
          providerList.replaceChildren();
          showStatus(providerError, "Sign-in options are temporarily unavailable. Please try again.");
        }
      }

      document.querySelector("#admin-login-button").addEventListener("click", () => {
        providerView.hidden = true;
        adminForm.hidden = false;
        adminForm.elements.username.focus();
      });

      document.querySelector("#admin-back").addEventListener("click", () => {
        adminForm.reset();
        setAdminMfaRequired(false);
        adminError.hidden = true;
        adminForm.hidden = true;
        providerView.hidden = false;
        document.querySelector("#admin-login-button").focus();
      });

      adminForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        adminError.hidden = true;
        adminSubmit.disabled = true;
        adminSubmit.textContent = "Checking…";
        const formData = new FormData(adminForm);
        try {
          const response = await fetch("/api/v1/auth/admin/login", {
            method: "POST",
            credentials: "same-origin",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email: formData.get("username"),
              password: formData.get("password"),
              mfaCode: adminMfaRequired ? formData.get("mfaCode") : undefined,
            }),
          });
          if (!response.ok) {
            const result = await response.json().catch(() => null);
            if (result?.error?.code === "mfa_required") {
              setAdminMfaRequired(true);
              showStatus(adminError, "Enter the current code from your authenticator app.");
              return;
            }
            const message = response.status === 401
              ? "The username or password is incorrect."
              : result?.error?.message || "Admin sign-in could not be completed.";
            showStatus(adminError, message);
            return;
          }
          window.location.assign("/");
        } catch {
          showStatus(adminError, "The sign-in service is unavailable. Please try again.");
        } finally {
          adminSubmit.disabled = false;
          adminSubmit.textContent = "Continue";
        }
      });

      closeButton.addEventListener("click", () => {
        dialog.hidden = true;
        reopenButton.hidden = false;
        reopenButton.focus();
      });

      reopenButton.addEventListener("click", () => {
        reopenButton.hidden = true;
        dialog.hidden = false;
        closeButton.focus();
      });

      void loadOptions();
    </script>
  </body>
</html>
